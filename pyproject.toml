[tool.poetry]
name = "snow-plow-bot"
version = "1.0.0"
description = "Configurable template bot that monitors PlogNorge snow plow activity near an address and posts updates to Bluesky"
authors = ["Turbolego <turbolego@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["snow", "plow", "plognorge", "template", "bluesky"]

[tool.poetry.dependencies]
python = "^3.11"
requests = "*"
python-dotenv = "*"
atproto = "*"
cryptography = ">=48.0.1"
Pillow = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"