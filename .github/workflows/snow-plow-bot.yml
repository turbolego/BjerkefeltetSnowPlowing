name: Snow Plow Bot

on:
  # Cron times are UTC. Adjust to your area's season / preferred frequency.
  # Winter (Nov-Mar, CET = UTC+1): run 4x/day to catch plow passes.
  # Spring/Autumn (Oct, Apr): run once a day.
  schedule:
    # Winter: 06:00, 12:00, 18:00, 00:00 CET
    - cron: "5 5,11,17,23 * 11,12,1,2,3 *"
    # Spring/Autumn: 08:00 CET daily
    - cron: "5 7 * 4,5,9,10 *"
  workflow_dispatch:
    inputs:
      force_post:
        description: >
          Post to Bluesky regardless of whether any road segment changed
          (debug). Overrides [post].post_on_changes_only for this run only.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  snow-plow-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run snow plow bot
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: |
          # Optional manual-run override: post even if no segment changed.
          # Empty (and false) on schedule runs -> normal change-detection.
          FORCE=""
          if [ "${{ github.event.inputs.force_post }}" = "true" ]; then
            FORCE="--force-post"
            echo "force_post override active: will post regardless of segment changes."
          fi
          # If no Bluesky secrets are set, run a dry-run so the job
          # still succeeds and logs the would-be post.
          if [ -n "$BSKY_HANDLE" ] && [ -n "$BSKY_PASSWORD" ]; then
            python plowbot.py $FORCE
          else
            echo "No BSKY_HANDLE/BSKY_PASSWORD secrets set; dry-run only."
            python plowbot.py --dry-run $FORCE
          fi

      - name: Commit updated map + state to main (triggers GitHub Pages)
        run: |
          MAP=$(python -c "from config import load_config; print(load_config().map_output)")
          STATE=$(python -c "from config import load_config; print(load_config().state_file)")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MAP" "$STATE"
          if git diff --cached --quiet; then
            echo "No changes to $MAP / $STATE — skipping commit."
          else
            git commit -m "Update $MAP and $STATE (auto)"
            git push origin main
          fi
